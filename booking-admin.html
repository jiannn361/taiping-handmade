<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>預約管理｜嘉義梅山太平</title>
  <link rel="stylesheet" href="style.css">
  <script src="booking-card.js" defer></script>
  <script src="booking-admin.js" defer></script>
</head>
<body>
  <header><a href="index.html" class="brand">嘉義梅山太平 <small>CRAFT &amp; SLOW</small></a></header>
  <main class="kiln-page">
    <section class="kiln-panel" aria-labelledby="admin-title">
      <h1 id="admin-title">預約管理</h1>
      <form id="admin-login" class="fields">
        <label for="admin-key">管理金鑰</label>
        <input id="admin-key" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">進入管理頁</button>
      </form>
      <div id="admin-panel" hidden>
        <form id="admin-search" class="fields">
          <label for="admin-code">預約編號</label>
          <input id="admin-code" type="search" maxlength="35" placeholder="留空查看最近 50 筆">
          <button class="primary" type="submit">查詢或更新名單</button>
        </form>
        <button id="admin-logout" class="secondary" type="button">登出</button>
        <section aria-labelledby="closure-title" class="kiln-result">
          <h2 id="closure-title">臨時暫停預約</h2>
          <p>指定體驗將全天暫停接受新申請。若已有預約，請另外聯絡客人。</p>
          <form id="admin-closure-form" class="fields">
            <label>體驗項目
              <select id="admin-closure-experience" required>
                <option>手拉胚</option>
                <option>陶杯刻畫</option>
                <option>植物槌染</option>
              </select>
            </label>
            <label>暫停日期 <input id="admin-closure-date" type="date" required></label>
            <button class="primary full" type="submit">暫停當天預約</button>
          </form>
          <p id="admin-closure-status" role="status"></p>
          <ul id="admin-closures"></ul>
        </section>
        <div id="admin-results"></div>
      </div>
      <p id="admin-status" role="status"></p>
    </section>
  </main>
</body>
</html>
