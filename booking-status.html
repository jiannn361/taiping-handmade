<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>查詢我的預約｜嘉義梅山太平</title>
  <link rel="icon" type="image/png" href="images/booking-favicon.png"><link rel="stylesheet" href="style.css">
  <script src="booking-status.js" defer></script>
</head>
<body>
  <header><a href="index.html" class="brand">嘉義梅山太平 <small>CRAFT &amp; SLOW</small></a><span>用雙手，留下一點美好。</span></header>
  <main class="kiln-page">
    <a class="kiln-back" href="index.html">← 回體驗預約</a>
    <section class="kiln-panel" aria-labelledby="booking-title">
      <h1 id="booking-title">查詢我的預約</h1>
      <p>使用 LINE 小卡或送出申請時顯示的預約編號，以及預約時填寫的手機號碼查詢。</p>
      <form class="booking-lookup-form" id="booking-lookup">
        <label for="booking-code">預約編號</label>
        <input id="booking-code" required maxlength="35" placeholder="BK-XXXXXXXXXXXX" autocapitalize="characters" spellcheck="false" autocomplete="off">
        <label for="booking-phone">手機號碼</label>
        <input id="booking-phone" type="tel" inputmode="numeric" required maxlength="10" pattern="09[0-9]{8}" autocomplete="tel-national">
        <button class="primary" type="submit">查詢預約</button>
      </form>
      <p id="booking-message" role="status"></p>
      <div class="kiln-result" id="booking-result" hidden></div>
    </section>
  </main>
</body>
</html>
